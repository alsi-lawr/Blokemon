  <title id="blk010-title">BLK-010 First Rollie non-final comic-vector mock-up</title>
  <desc id="blk010-desc">An extreme hands-and-smoke crop turns a novice's first hand-rolled cigarette into surgery: bitten fingertips pin a wrinkled paper while smoke hides half an irregular-cheeked face, nervous teeth and an open plain tin on a scarred garden table. Non-final placeholder art.</desc>
