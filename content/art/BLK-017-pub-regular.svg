 <title id="reg-title">BLK-017 Pub Regular non-final comic-vector mock-up</title><desc id="reg-desc">A heavy older regular fills his permanent corner in guarded half-profile, bald crown shining above grey sideburns and red cheeks, barrel belly settled into a bowed stool while both hands protect a half-pint beside one domino. Non-final placeholder art.</desc>
