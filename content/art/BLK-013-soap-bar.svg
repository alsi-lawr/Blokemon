  <title id="blk013-title">BLK-013 Soap Bar non-final comic-vector mock-up</title>
  <desc id="blk013-desc">Two huge suspicious hands thrust an ancient little wrapped block toward the lens under a hard car-park lamp; only the owner's narrowed eyes remain above it while a torn carrier, folded ticket, bollards and watching shadows make the exchange feel dubious. Non-final placeholder art.</desc>
