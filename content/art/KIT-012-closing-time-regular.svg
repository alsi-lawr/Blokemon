<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="k12-title k12-desc">
  <title id="k12-title">KIT-012 Closing-Time Regular non-final comic-vector mock-up</title>
  <desc id="k12-desc">An overhead last-orders aftermath shows a very old regular folded around an injured active patron, dabbing their scraped shoulder with a beer towel while crooked fingers guard the last glass. Tipped stools, dragged chairs, mop water and extinguishing lights crowd the closing pub. Non-final placeholder art.</desc>
  <defs>
    <linearGradient id="k12-floor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#432429"/>
      <stop offset=".48" stop-color="#291b25"/>
      <stop offset="1" stop-color="#11151a"/>
    </linearGradient>
    <linearGradient id="k12-oldcoat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#777151"/>
      <stop offset=".48" stop-color="#455044"/>
      <stop offset="1" stop-color="#202b2d"/>
    </linearGradient>
    <linearGradient id="k12-activecoat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b3650"/>
      <stop offset=".55" stop-color="#54283f"/>
      <stop offset="1" stop-color="#291d31"/>
    </linearGradient>
    <radialGradient id="k12-skin-old" cx="38%" cy="24%" r="85%">
      <stop offset="0" stop-color="#d8a177"/>
      <stop offset=".6" stop-color="#9b5d51"/>
      <stop offset="1" stop-color="#56313a"/>
