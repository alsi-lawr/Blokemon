      <stop offset=".58" stop-color="#ad5c4c"/>
      <stop offset="1" stop-color="#603342"/>
    </radialGradient>
    <radialGradient id="k12-lampglow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffd67a" stop-opacity=".82"/>
      <stop offset=".44" stop-color="#d88b3e" stop-opacity=".24"/>
      <stop offset="1" stop-color="#d88b3e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="k12-ale" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2d475"/>
      <stop offset=".2" stop-color="#c8862e"/>
      <stop offset="1" stop-color="#6d351f"/>
    </linearGradient>
    <pattern id="k12-carpet" width="76" height="62" patternUnits="userSpaceOnUse" patternTransform="rotate(-7)">
