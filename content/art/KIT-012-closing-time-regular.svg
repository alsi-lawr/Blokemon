      <path d="M7 5c23 10 38 10 61-1M5 57c22-11 43-10 66 1M4 31h68" fill="none" stroke="#8a4541" stroke-width="5" opacity=".28"/>
      <path d="M19 16 29 31 18 47M57 15 46 31l12 17" fill="none" stroke="#bf7a48" stroke-width="3" opacity=".27"/>
      <circle cx="38" cy="31" r="5" fill="#d49a52" opacity=".19"/>
