      <stop offset=".28" stop-color="#e8a842" stop-opacity=".3"/>
      <stop offset="1" stop-color="#d18634" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kit006-jacket" x1="0" y1="0" x2="1" y2="1">
