  <title id="kit006-title">KIT-006 The Ring Road non-final comic-vector mock-up</title>
  <desc id="kit006-desc">From a steep oblique aerial view, wet lanes, battered cars and a flyover coil around a traffic island. A tiny weary road worker seen from behind feeds a glowing energy can into a clanking roundabout machine while a fresh blank card drops from its other side. Non-final placeholder art.</desc>
