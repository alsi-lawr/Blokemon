      <stop offset=".5" stop-color="#30363b"/>
      <stop offset="1" stop-color="#1f2529"/>
    </linearGradient>
    <linearGradient id="kit006-island" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#72805b"/>
      <stop offset="1" stop-color="#33422f"/>
    </linearGradient>
    <radialGradient id="kit006-lamp">
