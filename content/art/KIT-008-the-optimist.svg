<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="kit008-title kit008-desc">
  <title id="kit008-title">KIT-008 The Optimist non-final comic gutter rescue mock-up</title>
  <desc id="kit008-desc">At rain-gutter level, a soaked, lanky hopeful lies almost horizontal beneath a bench, flipping a coin while stretching articulated fingers toward a discarded glowing energy token. His open buck-toothed plea, buckled clothes, wet pavement clutter and distant waiting bench make the recovery mechanic a physical joke. Non-final placeholder art.</desc>
