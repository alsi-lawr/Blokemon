    <linearGradient id="k8-sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#182c3c"/><stop offset=".56" stop-color="#365260"/><stop offset="1" stop-color="#12212c"/></linearGradient>
    <linearGradient id="k8-road" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#45535a"/><stop offset="1" stop-color="#151d24"/></linearGradient>
    <linearGradient id="k8-coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d39437"/><stop offset=".48" stop-color="#89542e"/><stop offset="1" stop-color="#3d2c2d"/></linearGradient>
    <linearGradient id="k8-skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e0a57c"/><stop offset=".6" stop-color="#a65b4e"/><stop offset="1" stop-color="#593238"/></linearGradient>
    <radialGradient id="k8-token"><stop stop-color="#fff1a0"/><stop offset=".25" stop-color="#e6bd38"/><stop offset=".66" stop-color="#a86d20"/><stop offset="1" stop-color="#4c321f"/></radialGradient>
