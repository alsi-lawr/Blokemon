  <title id="b081-title">BLK-081 One-Pint Wonder non-final comic mock-up</title>
  <desc id="b081-desc">From table height, a tiny white-curled speaker stands on a foot rail behind one enormous raised finger, commanding a loose semicircle while a single amber pint and vibrating blank phone loom near the lens. Non-final placeholder art.</desc>
