  <title id="blk007-title">BLK-007 Designated Driver non-final comic-vector mock-up</title>
  <desc id="blk007-desc">In cold side profile at the kerb, a calm driver dangles keys from an outsized foreground hand and guards a clear lime drink while warm blurred friends press against pub glass behind him and an anonymous headlamp waits in rain. Non-final placeholder art.</desc>
