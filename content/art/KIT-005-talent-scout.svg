      <stop stop-color="#161a2a"/><stop offset=".5" stop-color="#4c3044"/><stop offset="1" stop-color="#171a24"/>
    </linearGradient>
    <linearGradient id="kit005-boards" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#946550"/><stop offset="1" stop-color="#38252b"/>
    </linearGradient>
    <linearGradient id="kit005-skin" x1="0" y1="0" x2="1" y2="1">
