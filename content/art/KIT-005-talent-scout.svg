  <title id="kit005-title">KIT-005 Talent Scout non-final comic-vector mock-up</title>
  <desc id="kit005-desc">A tiny sharp elderly scout clings to a lighting ladder at the far left of a deep, crooked audition hall, enormous spectacles and a pointing finger aimed diagonally across eight radically different full-body hopefuls. One angular performer is hauled into a hard spotlight while blank audition cards belonging to the others tumble down a shuffle chute. Non-final placeholder art.</desc>
