<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
  <title id="title">BLK-025 Pintman non-final comic-vector prototype</title>
  <desc id="desc">Seen dramatically from floor level, a compact pub hero buckles under a tray of sloshing anonymous pints. His spread fingers, twisted feet, comic strain and a compressed rowdy crowd make an independent, tactile scene. Non-final placeholder art.</desc>
  <defs>
    <linearGradient id="ceiling" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27193c"/>
      <stop offset=".52" stop-color="#442447"/>
      <stop offset="1" stop-color="#7a3b42"/>
    </linearGradient>
    <linearGradient id="floor" x1=".5" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#3d211c"/>
      <stop offset="1" stop-color="#130f16"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4677a5"/>
      <stop offset=".44" stop-color="#264e82"/>
      <stop offset="1" stop-color="#172445"/>
    </linearGradient>
    <linearGradient id="beer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd165"/>
      <stop offset=".42" stop-color="#d9821e"/>
      <stop offset="1" stop-color="#8c3c14"/>
    </linearGradient>
    <radialGradient id="sweatFace" cx="52%" cy="24%" r="78%">
