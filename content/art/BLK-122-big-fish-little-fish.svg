  <title id="b122-title">BLK-122 Big Fish Little Fish non-final comic mock-up</title>
  <desc id="b122-desc">A fork-quiffed rave veteran stands beneath one violet club light, amused octagonal face steady while unequal white-gloved hands measure two precise invisible boxes around a striped shirt. Non-final placeholder art.</desc>
