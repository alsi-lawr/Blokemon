<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="kit002-title kit002-desc">
  <title id="kit002-title">KIT-002 The Spiral-Eyed Regular non-final comic-vector mock-up</title>
  <desc id="kit002-desc">An ancient pub regular sags sideways across a crushed corner chair, his enormous crossed leg, crooked table and walking stick barring the bright rival venue behind him. A lumpy liver-spotted half-profile carries one milky cataract and one thick spiral lens while a bony claw guards his drink. Non-final placeholder art.</desc>
  <defs>
    <linearGradient id="kit002-room" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#47685b"/><stop offset=".5" stop-color="#233e39"/><stop offset="1" stop-color="#111f23"/></linearGradient>
    <linearGradient id="kit002-door" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f3d56c"/><stop offset=".38" stop-color="#b66d48"/><stop offset="1" stop-color="#34313c"/></linearGradient>
    <radialGradient id="kit002-skin" cx="32%" cy="28%" r="84%"><stop stop-color="#d19a76"/><stop offset=".54" stop-color="#98594f"/><stop offset="1" stop-color="#512e38"/></radialGradient>
    <linearGradient id="kit002-cardigan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#827459"/><stop offset=".48" stop-color="#4c4c3f"/><stop offset="1" stop-color="#252d2b"/></linearGradient>
    <linearGradient id="kit002-trouser" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4f5148"/><stop offset=".65" stop-color="#2c3432"/><stop offset="1" stop-color="#171d1e"/></linearGradient>
    <linearGradient id="kit002-wood" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#a36d43"/><stop offset="1" stop-color="#422b24"/></linearGradient>
    <radialGradient id="kit002-drink" cx="40%" cy="18%" r="82%"><stop stop-color="#f4d272"/><stop offset=".54" stop-color="#a4612d"/><stop offset="1" stop-color="#4b2824"/></radialGradient>
    <pattern id="kit002-wallpaper" width="76" height="68" patternUnits="userSpaceOnUse"><path d="M38 4c-11 17-11 34 0 52 11-18 11-35 0-52Zm0 18C20 14 8 20 4 37c17 3 28-2 34-15Zm0 0c18-8 30-2 34 15-17 3-28-2-34-15Z" fill="#879978" opacity=".17"/><path d="M0 66h76" stroke="#192d2c" stroke-width="4"/></pattern>
    <pattern id="kit002-carpet" width="57" height="43" patternUnits="userSpaceOnUse"><path d="m0 21 28-18 29 18-29 19Z" fill="#754846" opacity=".3"/><path d="M0 21h57M28 3v37" stroke="#b0805b" stroke-width="3" opacity=".2"/></pattern>
