<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
  <title id="title">BLK-001 Weedman Will non-final comic-vector prototype</title>
  <desc id="desc">A wary, rain-soaked pub-awning regular leans through a cramped smoking shelter and offers a hand-rolled cigarette over a chipped enamel tray. Brick, leaking gutter, smoke, wet coats and clutter make the scene deliberately specific. Non-final placeholder art.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#122c2b"/>
      <stop offset="0.52" stop-color="#1d4a3b"/>
      <stop offset="1" stop-color="#08191b"/>
    </linearGradient>
    <linearGradient id="awning" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b5a64f"/>
      <stop offset="0.48" stop-color="#5b622f"/>
      <stop offset="1" stop-color="#26351f"/>
    </linearGradient>
    <linearGradient id="parka" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#687344"/>
      <stop offset="0.55" stop-color="#344c38"/>
      <stop offset="1" stop-color="#182c27"/>
    </linearGradient>
    <radialGradient id="face" cx="42%" cy="32%" r="76%">
