      <stop offset="0.42" stop-color="#f19d4d" stop-opacity=".32"/>
      <stop offset="1" stop-color="#f19d4d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="brick" width="88" height="48" patternUnits="userSpaceOnUse">
