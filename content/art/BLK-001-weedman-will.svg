      <path d="M4 8c16-6 26-2 38 1M50 30c12-5 23-3 32 2" fill="none" stroke="#a6604c" stroke-width="3" opacity=".48"/>
    </pattern>
    <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(14)">
      <path d="M0 2h12M0 8h12" stroke="#17201a" stroke-width="2" opacity=".34"/>
    </pattern>
    <filter id="paper" x="-8%" y="-8%" width="116%" height="116%">
