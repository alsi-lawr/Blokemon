      <feDisplacementMap in="SourceGraphic" in2="warp" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <clipPath id="coatClip">
      <path d="M392 356C424 320 481 310 548 326c60 14 120 64 160 138l-8 96H282c18-68 56-155 110-204Z"/>
    </clipPath>
