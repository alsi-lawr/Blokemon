  <title id="b087-title">BLK-087 Ice Bath non-final comic mock-up</title>
  <desc id="b087-desc">A true overhead view holds a calm round-faced athlete neck-deep in a tiled ice bath, broad shoulders still beneath pale water while two abstract timers and folded towels wait symmetrically beyond the frosted rim. Non-final placeholder art.</desc>
