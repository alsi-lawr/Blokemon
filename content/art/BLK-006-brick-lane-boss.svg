  <title id="blk006-title">BLK-006 Brick Lane Boss non-final comic-vector mock-up</title>
  <desc id="blk006-desc">A shaved-headed, square-built curry-house boss leans his full weight out of a steaming doorway, jowls set and eyes cutting sternly sideways while one huge hand stops the queue and the other grips a blank reservation book. Non-final placeholder art.</desc>
