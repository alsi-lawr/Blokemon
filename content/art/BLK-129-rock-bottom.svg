  <title id="b129-title">BLK-129 Rock Bottom non-final comic mock-up</title>
  <desc id="b129-desc">A tiny hood-slipped figure sits folded on the lowest ledge of an enormous drained municipal basin, untouched water and coat beside him as cold blue concrete opens toward one pale dawn horizon. Non-final placeholder art.</desc>
