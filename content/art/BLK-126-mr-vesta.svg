  <title id="b126-title">BLK-126 Mr Vesta non-final comic mock-up</title>
  <desc id="b126-desc">A dignified bald older diner cups both steady hands around a glowing enamel curry warmer, white ear tufts and solemn moustache catching candle-brass reflections before the food does. Non-final placeholder art.</desc>
