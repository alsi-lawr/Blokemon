  <title id="b044-title">BLK-044 Whitey non-final comic mock-up</title>
  <desc id="b044-desc">A violently canted close-up shows a pale, lank-haired partygoer clawing a kitchen counter as one knee buckles, one eye rolls and an untouched water glass slides toward an open window. Non-final placeholder art.</desc>
