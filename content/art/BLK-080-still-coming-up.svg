  <title id="b080-title">BLK-080 Still Coming Up non-final comic mock-up</title>
  <desc id="b080-desc">A doubtful lank figure lies almost flat across a kitchen floor with a folded coat for a pillow, holding an orange slice below a blank-faced clock as a thin dawn line leaks in. Non-final placeholder art.</desc>
