 <title id="cig-title">BLK-016 Ciggy Sam non-final comic-vector mock-up</title>
 <desc id="cig-desc">A narrow weathered smoker stoops in hard side profile beneath a tiny leaking awning, broken nose aimed into the rain, missing tooth visible as he offers his last cigarette while clutching a blank folded racing page. Non-final placeholder art.</desc>
