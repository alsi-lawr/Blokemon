  <title id="b039-title">BLK-039 Karaoke Kev non-final comic mock-up</title>
  <desc id="b039-desc">From a low fisheye stage view, pot-bellied Karaoke Kev bends his knees and grips a microphone with both hands, cable wrapped around one ankle as he launches into an enormous solo. Non-final placeholder art.</desc>
