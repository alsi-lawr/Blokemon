    <linearGradient id="k10-wood" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b87943"/><stop offset=".24" stop-color="#74442f"/><stop offset=".7" stop-color="#432b25"/><stop offset="1" stop-color="#211b1b"/></linearGradient>
    <linearGradient id="k10-brass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff0a0"/><stop offset=".2" stop-color="#b88431"/><stop offset=".47" stop-color="#5d4325"/><stop offset=".69" stop-color="#deb65a"/><stop offset="1" stop-color="#4a321f"/></linearGradient>
    <linearGradient id="k10-skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d49269"/><stop offset=".45" stop-color="#aa5f50"/><stop offset="1" stop-color="#592f37"/></linearGradient>
