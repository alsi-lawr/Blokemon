  <title id="kit010-title">KIT-010 The Guv'nor non-final extreme bar-counter mock-up</title>
  <desc id="kit010-desc">At extreme counter height, one scarred landlord hand confiscates a sloshing opponent drink while the other slams a glowing replacement toward the near active stool. Only a glowering eye and broken nose survive as a warped reflection in dented brass; wet rings, crumbs, rag, taps and individually bent fingers fill the crop. Non-final placeholder art.</desc>
