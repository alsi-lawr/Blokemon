<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="k14-title k14-desc">
  <title id="k14-title">KIT-014 Old-School Bouncer non-final comic-vector mock-up</title>
  <desc id="k14-desc">At wet floor level, an enormous retired bouncer in suspenders turns his battered back and shoulder into an impact wall for a smaller stage-one patron. His cauliflower ear, crushed nose profile, articulated foreground fist and huge boots dominate a rainy doorway layered with velvet rope, startled queue and flying droplets. Non-final placeholder art.</desc>
  <defs>
    <linearGradient id="k14-night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10232b"/>
      <stop offset=".45" stop-color="#1d2832"/>
      <stop offset="1" stop-color="#080d13"/>
    </linearGradient>
    <linearGradient id="k14-door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b263a"/>
      <stop offset=".48" stop-color="#351c2a"/>
      <stop offset="1" stop-color="#14141b"/>
    </linearGradient>
    <linearGradient id="k14-shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8cbb1"/>
      <stop offset=".46" stop-color="#9d8e7c"/>
      <stop offset="1" stop-color="#4c4746"/>
    </linearGradient>
    <linearGradient id="k14-trousers" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#413f48"/>
      <stop offset="1" stop-color="#181b22"/>
    </linearGradient>
    <radialGradient id="k14-skin" cx="34%" cy="24%" r="88%">
