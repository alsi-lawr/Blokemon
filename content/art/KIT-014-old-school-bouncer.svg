      <stop offset=".35" stop-color="#e8753f" stop-opacity=".4"/>
      <stop offset="1" stop-color="#b43842" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="k14-lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffc864" stop-opacity=".86"/>
      <stop offset=".42" stop-color="#d55a48" stop-opacity=".26"/>
      <stop offset="1" stop-color="#d55a48" stop-opacity="0"/>
    </radialGradient>
    <pattern id="k14-rain" width="73" height="61" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
