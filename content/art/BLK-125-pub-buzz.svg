    <linearGradient id="b125-amber" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff0a1"/><stop offset=".24" stop-color="#eaa834"/><stop offset="1" stop-color="#7a351d"/></linearGradient>
    <pattern id="b125-table" width="91" height="51" patternUnits="userSpaceOnUse"><rect width="91" height="51" fill="#5a2f21"/><path d="M0 9c29-8 58-7 87 2M11 39c25-6 49-5 72 2" fill="none" stroke="#9a5931" stroke-width="5" opacity=".52"/></pattern>
