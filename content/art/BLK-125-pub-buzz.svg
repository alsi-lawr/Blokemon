  <title id="b125-title">BLK-125 Pub Buzz non-final comic mock-up</title>
  <desc id="b125-desc">An extreme tabletop crop catches a yellow-mohawked drinker drumming three different fingers in quick succession, alert triangular eyes already seeking a reply beside one anonymous half-pint. Non-final placeholder art.</desc>
