<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="kit011-title kit011-desc">
  <title id="kit011-title">KIT-011 The Door Staff non-final low queue mock-up</title>
  <desc id="kit011-desc">From below a rain-slick barrier, a broad female door supervisor in hard three-quarter profile fans an opponent's blank cards with one articulated hand and hooks an odd little patron backwards toward a card-shaped chute with the other. Her cauliflower ear, segmented braid, heavy boots, wet queue and layered umbrellas make the bottom-of-deck gag physical. Non-final placeholder art.</desc>
  <defs>
    <linearGradient id="k11-night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101b30"/><stop offset=".52" stop-color="#273c4c"/><stop offset="1" stop-color="#090d18"/></linearGradient>
    <linearGradient id="k11-coat" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3c5975"/><stop offset=".42" stop-color="#26374f"/><stop offset="1" stop-color="#111a2a"/></linearGradient>
    <linearGradient id="k11-skin" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d9946f"/><stop offset=".55" stop-color="#9d554d"/><stop offset="1" stop-color="#542f3b"/></linearGradient>
    <linearGradient id="k11-puddle" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#6f919b"/><stop offset="1" stop-color="#18242e"/></linearGradient>
    <pattern id="k11-rain" width="47" height="43" patternUnits="userSpaceOnUse" patternTransform="rotate(15)"><path d="M5 0v31M25 13v29M41 2v18" stroke="#afd0d5" stroke-width="3" opacity=".42"/></pattern>
