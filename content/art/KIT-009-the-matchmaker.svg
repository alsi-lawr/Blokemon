  <title id="kit009-title">KIT-009 The Matchmaker non-final crowded social-club mock-up</title>
  <desc id="kit009-desc">In a cramped social-club corner, a stout elderly matchmaker drags a tiny reluctant guest out from behind a curtain while rifling his exposed blank cards toward a long, unequal rival folded into a vinyl chair. Three distinct bodies, forceful hands, sticky-table clutter and switched seating make the mechanic physical. Non-final placeholder art.</desc>
