    <linearGradient id="k9-cardigan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d76d61"/><stop offset=".5" stop-color="#913e4b"/><stop offset="1" stop-color="#4f263d"/></linearGradient>
    <linearGradient id="k9-skinA" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e2ae88"/><stop offset=".55" stop-color="#ae6759"/><stop offset="1" stop-color="#61343c"/></linearGradient>
    <linearGradient id="k9-skinB" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c98a69"/><stop offset="1" stop-color="#6b3d43"/></linearGradient>
