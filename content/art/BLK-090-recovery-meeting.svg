  <title id="b090-title">BLK-090 Recovery Meeting non-final comic mock-up</title>
  <desc id="b090-desc">A quiet salt-and-pepper-haired attendee sits side-three-quarter within a circle of empty chairs, both folded hands warming around a plain mug as biscuits and cream light wait for the next arrival. Non-final placeholder art.</desc>
