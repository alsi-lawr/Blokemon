  <title id="k13-title">KIT-013 Health-and-Safety Rep non-final comic-vector mock-up</title>
  <desc id="k13-desc">From a steep inspection angle, a wiry angular safety representative in severe beaked profile braces a battered umbrella barrier against a falling steel hazard while stretching measuring tape around a crouched basic patron. Flyaway bun, jointed fingers, blank clipboard, cable, spill, ladder and scattered site clutter make the protection specific. Non-final placeholder art.</desc>
