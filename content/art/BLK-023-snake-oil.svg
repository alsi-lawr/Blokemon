<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="oil-title oil-desc"><title id="oil-title">BLK-023 Snake Oil non-final comic-vector mock-up</title><desc id="oil-desc">From below a crowded market stall, a very tall angular salesman leans over a fan of harmless blank tonics, long chin, slick widow's peak and waxed pencil moustache caught in acidic light while his tiny case bursts open at his pointed shoes. Non-final placeholder art.</desc>
