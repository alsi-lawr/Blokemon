  <title id="b041-title">BLK-041 Balaclava non-final comic mock-up</title>
  <desc id="b041-desc">A small full-body figure freezes mid-step beneath a blank security camera, dark face covering and hunched coat failing to disguise bright battered trainers under a cold street light. Non-final placeholder art.</desc>
