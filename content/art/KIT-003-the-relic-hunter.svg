    </pattern>
    <pattern id="kit003-hatch" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(24)"><path d="M0 2h13M0 9h13" stroke="#15191a" stroke-width="2" opacity=".3"/></pattern>
    <filter id="kit003-rough" x="-8%" y="-8%" width="116%" height="116%"><feTurbulence type="turbulence" baseFrequency=".018 .048" numOctaves="2" seed="303" result="w"/><feDisplacementMap in="SourceGraphic" in2="w" scale="1.9"/></filter>
