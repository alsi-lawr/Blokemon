<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="kit003-title kit003-desc">
  <title id="kit003-title">KIT-003 The Relic Hunter non-final comic-vector mock-up</title>
  <desc id="kit003-desc">An overhead raid on a battered display cabinet is dominated by foreshortened arms, individually crooked fingers, magnifier, blank tags and peculiar finds. A distorted face appears only in reflection while a chalk-and-foil ward deflects intrusive ability-like sparks from the prized relic. Non-final placeholder art.</desc>
  <defs>
    <linearGradient id="kit003-floor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#584333"/><stop offset=".48" stop-color="#342b27"/><stop offset="1" stop-color="#171b1c"/></linearGradient>
    <linearGradient id="kit003-cabinet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9a6a41"/><stop offset=".45" stop-color="#63432f"/><stop offset="1" stop-color="#30251f"/></linearGradient>
    <radialGradient id="kit003-glass" cx="41%" cy="35%" r="72%"><stop stop-color="#e1f0d8" stop-opacity=".58"/><stop offset=".55" stop-color="#87a89a" stop-opacity=".21"/><stop offset="1" stop-color="#223d3d" stop-opacity=".52"/></radialGradient>
    <radialGradient id="kit003-skin" cx="35%" cy="29%" r="80%"><stop stop-color="#d49a70"/><stop offset=".55" stop-color="#9a5949"/><stop offset="1" stop-color="#563138"/></radialGradient>
    <linearGradient id="kit003-glove" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c2b787"/><stop offset=".52" stop-color="#77765f"/><stop offset="1" stop-color="#363d37"/></linearGradient>
