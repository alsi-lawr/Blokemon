<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="kit007-title kit007-desc">
  <title id="kit007-title">KIT-007 Auntie at the Door non-final comic-vector mock-up</title>
  <desc id="kit007-desc">From a low distorted threshold camera, a chained front door and two enormous arthritic hands obstruct almost everything. One hand pinches two blank envelopes close to the lens; the other lifts and separates face-down prize parcels. Only a sliver of a narrow elderly auntie appears behind the door: a magnified suspicious eye, hooked cheek, sliding spectacles and pinned wiry hair. Non-final placeholder art.</desc>
