    <linearGradient id="kit007-night" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#193943"/><stop offset="1" stop-color="#101724"/>
    </linearGradient>
    <linearGradient id="kit007-hall" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#d19b63"/><stop offset=".52" stop-color="#71473c"/><stop offset="1" stop-color="#29232a"/>
    </linearGradient>
    <linearGradient id="kit007-door" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7a5135"/><stop offset=".5" stop-color="#452d26"/><stop offset="1" stop-color="#21181a"/>
    </linearGradient>
    <linearGradient id="kit007-skin" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#dfb18a"/><stop offset=".55" stop-color="#a66b5d"/><stop offset="1" stop-color="#6e4145"/>
    </linearGradient>
    <radialGradient id="kit007-bulb" cx="50%" cy="25%" r="75%">
