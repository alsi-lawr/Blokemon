<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="b121-title b121-desc">
  <title id="b121-title">BLK-121 Marathon non-final comic mock-up</title>
  <desc id="b121-desc">A long, exhausted runner holds a crooked final-mile stride toward one comet-white point, blank race vest and tired arms framed by midnight barriers and trailing reflective foil. Non-final placeholder art.</desc>
  <defs>
    <linearGradient id="b121-night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071526"/><stop offset=".52" stop-color="#173859"/><stop offset="1" stop-color="#080c17"/></linearGradient>
    <radialGradient id="b121-point" cx="50%" cy="50%" r="50%"><stop stop-color="#ffffff"/><stop offset=".24" stop-color="#dff5ff" stop-opacity=".7"/><stop offset="1" stop-color="#dff5ff" stop-opacity="0"/></radialGradient>
    <pattern id="b121-road" width="79" height="47" patternUnits="userSpaceOnUse"><rect width="79" height="47" fill="#162538"/><path d="M4 13c21-6 41-5 61 2M15 36c19-4 36-3 53 2" fill="none" stroke="#30445b" stroke-width="4" opacity=".55"/></pattern>
    <filter id="b121-fatigue" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence baseFrequency=".014 .05" numOctaves="1" seed="121" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="1.6"/></filter>
  </defs>
